<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haul — Fangst- og redskapsdagbok for fiskere</title>
  <meta name="description" content="Haul er appen for norske fritids- og yrkesfiskere. Sett ut, trekk og logg fangsten din.">
  <meta property="og:title" content="Haul">
  <meta property="og:description" content="Fangst- og redskapsdagbok for fiskere">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://haul.fish">
  <meta property="og:image" content="https://haul.fish/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #080F1C;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/main-picture.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(8, 15, 28, 0.45) 0%,
        rgba(8, 15, 28, 0.72) 40%,
        rgba(8, 15, 28, 0.99) 100%
      );
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 40px 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 64px;
    }

    .brand-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background-color: #E8A42A;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 9px;
      color: #E8A42A;
      line-height: 1;
    }

    .contact {
      margin-bottom: 32px;
    }

    .contact a {
      color: #93C3E0;
      text-decoration: none;
      font-size: 15px;
      font-weight: 400;
      transition: color 0.2s;
    }

    .contact a:hover {
      color: #DCEEFA;
    }

    .legal {
      display: flex;
      gap: 24px;
    }

    .legal a {
      color: #DCEEFA;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .legal a:hover {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .logo {
        width: 56px;
        height: 56px;
      }

      .brand-name {
        font-size: 28px;
        letter-spacing: 7px;
      }

      .brand-dot {
        width: 9px;
        height: 9px;
      }

      .brand {
        gap: 10px;
        margin-bottom: 48px;
      }

      .legal {
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg"></div>
    <div class="content">
      <img src="assets/logo-transparent.png" alt="Haul logo" class="logo">
      <div class="brand">
        <div class="brand-dot"></div>
        <span class="brand-name">HAUL</span>
      </div>
      <div class="contact">
        <a href="mailto:contact@haul.fish">contact@haul.fish</a>
      </div>
      <nav class="legal">
        <a href="/privacy">Personvernerklæring</a>
        <a href="/terms">Brukervilkår</a>
      </nav>
    </div>
  </div>
</body>
</html>
